# Weekly dependency update PRs into develop. Minor/patch updates are grouped into one PR to keep noise low;
# major updates get their own PR because they can break things.
version: 2
updates:
  - package-ecosystem: pub
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # google_sign_in 7 has a breaking API change (no GoogleSignIn() constructor, no signIn()).
      # It will be adopted in Phase 2 together with the backend auth work; remove this rule then.
      - dependency-name: google_sign_in
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: 'chore(ci)'
    groups:
      github-actions:
        patterns: ['*']
